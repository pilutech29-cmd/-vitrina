<title>Tienda PicksOnline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: cabecera fija con buscador; inicio = cuadrícula de categorías; categoría = cuadrícula de productos; ficha en hoja inferior */
:root{
  --ink:#0d0c12;        /* fondo */
  --card:#17161f;       /* tarjetas */
  --line:#2a2833;       /* bordes */
  --paper:#f6f4fb;      /* texto */
  --muted:#a9a4ba;      /* texto secundario */
  --wa:#25d366;         /* marca / WhatsApp */
  --wa-ink:#06280f;
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cabecera */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);border-bottom:1px solid var(--line)}
header .wrap{display:flex;flex-direction:column;gap:12px;padding-block:14px 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.brand .bn{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-weight:800;font-size:1.4rem;letter-spacing:-.01em}
.brand small{font:600 .72rem var(--body);color:var(--muted);margin-top:3px}
.brand small span{color:var(--wa)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;box-sizing:border-box;font:500 1rem var(--body);color:var(--paper);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 40px 12px 42px}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:2px solid var(--wa);outline-offset:1px}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);font-size:1.3rem;width:34px;height:34px;cursor:pointer;border-radius:8px}

main .wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.9rem}
.bar{display:flex;align-items:center;gap:10px}
.back{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--paper);cursor:pointer;flex:none}
.back svg{width:18px;height:18px}

/* categorías */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:var(--paper);text-align:left;cursor:pointer;font:inherit}
.cat:hover{border-color:var(--wa)}
.cat .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--paper)}
.cat .ico svg{width:24px;height:24px}
.cat b{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.15}
.cat span{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* productos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.prod{display:flex;flex-direction:column;border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden;cursor:pointer;text-align:left;color:var(--paper);font:inherit;padding:0}
.prod:hover{border-color:var(--wa)}
.prod .ph{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 20%,var(--tint),var(--card) 80%)}
.prod .ph img,.prod .ph svg{width:78%;height:78%;object-fit:contain}
.prod .tx{display:flex;flex-direction:column;gap:4px;padding:10px 12px 14px;min-width:0}
.prod .tag{align-self:flex-start;font:700 .62rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--wa)}
.prod b{font-weight:700;font-size:.95rem;line-height:1.2}
.prod .pr{font-family:var(--display);font-weight:600;font-size:1.02rem;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.demo{font-size:.75rem;color:var(--muted)}

.cat:focus-visible,.prod:focus-visible,.back:focus-visible,.wa:focus-visible,.close:focus-visible{outline:2px solid var(--wa);outline-offset:2px}

/* ficha */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.panel{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:12px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .25s ease}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.grab{align-self:center;width:42px;height:5px;border-radius:3px;background:var(--line)}
.panel .ph{aspect-ratio:16/10;max-width:100%;border-radius:14px;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 20%,var(--tint),var(--ink) 85%)}
.panel .ph img,.panel .ph svg{width:70%;height:80%;object-fit:contain}
.panel h2{margin:0;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05;text-wrap:balance}
.panel .pr{font-family:var(--display);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums}
.panel p{margin:0;color:var(--muted);line-height:1.5;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.75rem;padding:4px 9px;border:1px solid var(--line);border-radius:999px}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:14px;background:var(--wa);color:var(--wa-ink);font:700 1rem var(--body);text-decoration:none}
.wa svg{width:22px;height:22px}
.note{font-size:.75rem;color:var(--muted);text-align:center}
.close{align-self:center;background:none;border:1px solid var(--line);color:var(--paper);font:600 .9rem var(--body);padding:10px 18px;border-radius:10px;cursor:pointer}
</style>

const tintDe = c => (categorias().find(x => x.nombre === c) || {tint:TINTS[0]}).tint;

const view = document.getElementById("view");
const q = document.getElementById("q");
const clearBtn = document.getElementById("clear");
const sheet = document.getElementById("sheet");
let estado = {cat:null};

function tarjeta(it){
  const i = ITEMS.indexOf(it);
  const arte = it.foto ? `<img src="${esc(it.foto)}" alt="" loading="lazy">` : (ART[it.art] || ART.box);
  return `<button class="prod" data-i="${i}" style="--tint:${tintDe(it.categoria)}">
    <div class="ph">${arte}</div>
    <div class="tx">${it.etiqueta ? `<span class="tag">${esc(it.etiqueta)}</span>` : ""}<b>${esc(it.nombre)}</b><span class="pr">${esc(it.precio)}</span></div>
  </button>`;
}

function render(){
  const term = norm(q.value);
  clearBtn.hidden = !q.value;
  if (term){
    const res = ITEMS.filter(it => norm(`${it.nombre} ${it.categoria} ${it.desc} ${it.etiqueta}`).includes(term));
    view.innerHTML = `<div class="bar"><h1>Resultados</h1></div>
      <p class="sub">${res.length} ${res.length === 1 ? "resultado" : "resultados"} para "${esc(q.value)}"</p>
      ${res.length ? `<div class="grid">${res.map(tarjeta).join("")}</div>` : `<div class="empty">No encontramos "${esc(q.value)}". Escríbenos por WhatsApp y te ayudamos a conseguirlo.</div>`}`;
    return;
  }
  if (estado.cat){
    const lista = ITEMS.filter(it => it.categoria === estado.cat);
    view.innerHTML = `<div class="bar"><button class="back" id="back" aria-label="Volver a categorías">${BACK}</button><h1>${esc(estado.cat)}</h1></div>
      <p class="sub">${lista.length} ${lista.length === 1 ? "opción" : "opciones"}${DEMO ? " · precios de ejemplo" : ""}</p>
      <div class="grid">${lista.map(tarjeta).join("")}</div>`;
    return;
  }
  view.innerHTML = `<h1>¿Qué estás buscando?</h1>
    <div class="cats">${categorias().map(c => `<button class="cat" data-cat="${esc(c.nombre)}" style="--tint:${c.tint}">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${CAT_ICON[norm(c.nombre)] || ICON_DEF}</svg></span>
      <b>${esc(c.nombre)}</b><span>${c.n} ${c.n === 1 ? "opción" : "opciones"}</span></button>`).join("")}</div>
    ${DEMO ? `<p class="demo">Productos y precios de ejemplo. Se reemplazan al conectar tu hoja de Google Sheets.</p>` : ""}`;
}

function abrirCat(c){
  estado.cat = c;
  try { history.replaceState(null, "", c ? "#" + slug(c) : location.pathname); } catch(e){}
  render(); window.scrollTo(0,0);
}

function abrirFicha(it){
  const arte = it.foto ? `<img src="${esc(it.foto)}" alt="${esc(it.nombre)}">` : (ART[it.art] || ART.box);
  sheet.innerHTML = `<div class="panel" role="dialog" aria-modal="true" aria-label="${esc(it.nombre)}" style="--tint:${tintDe(it.categoria)}">
    <span class="grab"></span>
    <div class="ph">${arte}</div>
    <h2>${esc(it.nombre)}</h2>
    <div class="pr">${esc(it.precio)}</div>
    ${it.desc ? `<p>${esc(it.desc)}</p>` : ""}
    ${it.pagos.length ? `<div class="chips">${it.pagos.map(p => `<span>${esc(p)}</span>`).join("")}</div>` : ""}
    <a class="wa" href="${waLink(it)}" target="_blank" rel="noopener">${WA_ICON} Escríbeme por WhatsApp</a>
    <div class="note">WhatsApp 305 257 7821 · Te respondemos y coordinamos la entrega</div>
    <button class="close" id="close">Cerrar</button></div>`;
  sheet.hidden = false;
  sheet.querySelector(".wa").focus();
}
function cerrarFicha(){ sheet.hidden = true; sheet.innerHTML = ""; }

view.addEventListener("click", e => {
  const c = e.target.closest("[data-cat]"); if (c) return abrirCat(c.dataset.cat);
  if (e.target.closest("#back")) return abrirCat(null);
  const p = e.target.closest("[data-i]"); if (p) abrirFicha(ITEMS[+p.dataset.i]);
});
sheet.addEventListener("click", e => { if (e.target === sheet || e.target.closest("#close")) cerrarFicha(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) cerrarFicha(); });
q.addEventListener("input", render);
clearBtn.addEventListener("click", () => { q.value = ""; render(); q.focus(); });

function parseCSV(text){
  const rows=[]; let row=[], f="", qq=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (qq){ if (c=='"'){ if (text[i+1]=='"'){ f+='"'; i++; } else qq=false; } else f+=c; }
    else if (c=='"') qq=true;
    else if (c==','){ row.push(f); f=""; }
    else if (c=='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!='\r') f+=c;
  }
  if (f!=="" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function fotoURL(v){
  v=(v||"").trim(); if(!v) return "";
  const m=v.match(/\/d\/([\w-]{20,})/) || v.match(/[?&]id=([\w-]{20,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000` : v;
}
async function cargarHoja(){
  if (!SHEET_CSV) return;
  try{
    const r = await fetch(SHEET_CSV + (SHEET_CSV.includes("?")?"&":"?") + "t=" + Date.now());
    if (!r.ok) throw 0;
    const rows = parseCSV(await r.text());
    const head = rows.shift().map(h => norm(h));
    const items = rows.filter(r => r.some(x => x.trim())).map(r => {
      const g = n => { const k = head.indexOf(n); return k >= 0 ? (r[k]||"").trim() : ""; };
      return {
        categoria: g("categoria") || (norm(g("tipo")).startsWith("serv") ? "Servicio técnico" : "Productos"),
        nombre: g("nombre"), precio: g("precio"), etiqueta: g("etiqueta"), desc: g("descripcion"),
        pagos: g("pagos").split(",").map(x => x.trim()).filter(Boolean),
        foto: fotoURL(g("foto")), art: "box", activo: norm(g("activo"))
      };
    }).filter(it => it.nombre && it.activo !== "no");
    if (items.length){ ITEMS = items; DEMO = false; }
  }catch(e){ /* si falla, quedan los de ejemplo */ }
}

function desdeHash(){
  const h = location.hash.slice(1);
  const c = h && categorias().find(x => slug(x.nombre) === h);
  estado.cat = c ? c.nombre : null;
}
desdeHash(); render();
cargarHoja().then(() => { if (!DEMO){ desdeHash(); render(); } });
</script>
