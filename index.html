<title>Ventas de productos · PicksOnline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: feed vertical a pantalla completa, un producto por pantalla, deslizar hacia arriba como TikTok/Reels */
:root{
  --ink:#0d0c12;          /* fondo general */
  --paper:#f6f4fb;        /* texto principal */
  --muted:#b9b4c9;        /* texto secundario */
  --glass:rgba(13,12,18,.55);
  --wa:#25d366;           /* botón WhatsApp */
  --heart:#ff4f7b;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden}

/* barra superior */
.top{position:absolute;inset:0 0 auto;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--ink) 0%,transparent 100%)}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.brand .bname span{color:var(--wa)}
@media (max-width:370px){.brand .bname{display:none}}
.tabs{display:flex;gap:4px;background:var(--glass);border-radius:999px;padding:4px;backdrop-filter:blur(8px)}
.tabs button{font:600 .82rem var(--body);color:var(--muted);background:none;border:0;padding:7px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink)}
.tabs button:focus-visible,.act:focus-visible,.wa:focus-visible{outline:2px solid var(--wa);outline-offset:2px}

/* feed */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.bg{position:absolute;inset:0;z-index:0}
.art{position:absolute;inset:12% 10% 38% 10%;display:grid;place-items:center;z-index:1}
.art img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 24px 40px rgba(0,0,0,.45))}
.art svg{width:100%;height:100%;max-width:340px;filter:drop-shadow(0 24px 40px rgba(0,0,0,.45))}
.shade{position:absolute;inset:auto 0 0;height:62%;background:linear-gradient(transparent,rgba(8,7,12,.92) 70%);z-index:1}

.info{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:calc(84px + env(safe-area-inset-right,0px));padding-block:0 26px}
.tag{align-self:flex-start;font:700 .7rem var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:6px;background:rgba(255,255,255,.14)}
.info h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.price{font-family:var(--display);font-weight:600;font-size:1.35rem;font-variant-numeric:tabular-nums}
.price small{font:500 .72rem var(--body);color:var(--muted);margin-left:6px}
.desc{margin:0;color:var(--muted);line-height:1.45;font-size:.95rem;max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.75rem;padding:4px 9px;border:1px solid rgba(255,255,255,.22);border-radius:999px;color:var(--paper)}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px;padding:14px 18px;border-radius:14px;
  background:var(--wa);color:#06280f;font:700 1rem var(--body);text-decoration:none}
.wa svg{width:22px;height:22px}

/* columna de acciones a la derecha, como TikTok */
.rail{position:absolute;z-index:3;right:calc(12px + env(safe-area-inset-right,0px));bottom:150px;display:flex;flex-direction:column;gap:18px;align-items:center}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--paper);font:600 .72rem var(--body);cursor:pointer;text-decoration:none}
.act .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(8px)}
.act svg{width:24px;height:24px}
.act.on .ic{color:var(--heart)}
.act.on svg path{fill:currentColor}
@media (prefers-reduced-motion:no-preference){.act.on .ic{animation:pop .35s ease}}
@keyframes pop{50%{transform:scale(1.2)}}

/* indicador de posición */
.dots{position:absolute;z-index:4;right:calc(6px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px}
.dots i{width:3px;height:14px;border-radius:2px;background:rgba(255,255,255,.25)}
.dots i.cur{background:var(--paper)}

.hint{position:absolute;z-index:4;left:50%;bottom:calc(6px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:.72rem;color:var(--muted);white-space:nowrap}
.toast{position:absolute;z-index:6;left:50%;top:70px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-weight:600;font-size:.85rem;padding:9px 14px;border-radius:10px}
.note{font-size:.7rem;color:var(--muted)}
</style>

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c=='"'){ if (text[i+1]=='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if (c=='"') q=true;
    else if (c==','){ row.push(f); f=""; }
    else if (c=='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if (c!='\r') f+=c;
  }
  if (f!=="" || row.length){ row.push(f); rows.push(row); }
  return rows;
}

function fotoURL(v){
  v=(v||"").trim(); if(!v) return "";
  const m=v.match(/\/d\/([\w-]{20,})/) || v.match(/[?&]id=([\w-]{20,})/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000` : v;
}

  const n = v.replace(/[.\s]/g,"");

    if (!r.ok) throw 0;
    const rows = parseCSV(await r.text());
    const head = rows.shift().map(h => h.trim().toLowerCase());
    const col = n => head.indexOf(n);
    const items = rows.filter(r => r.some(x => x.trim())).map((r,i) => {
      const g = n => (col(n) >= 0 ? (r[col(n)]||"").trim() : "");
      return {
        tipo: g("tipo").toLowerCase().startsWith("serv") ? "servicio" : "producto",
        nombre: g("nombre"), precio: fmtPrecio(g("precio")), etiqueta: g("etiqueta"),
        desc: g("descripcion") || g("descripción"),
        chips: g("pagos").split(",").map(x => x.trim()).filter(Boolean),
        foto: fotoURL(g("foto")), art: "box",
        activo: g("activo").toLowerCase(),
        colores: PALETA[i % PALETA.length]
      };
    }).filter(it => it.nombre && it.activo !== "no");
    if (items.length){ ITEMS = items; DEMO = false; }
  }catch(e){ /* si falla, quedan los de ejemplo */ }
}

let likes = {};
try { likes = JSON.parse(localStorage.getItem("po-likes") || "{}"); } catch(e) {}
function saveLikes(){ try { localStorage.setItem("po-likes", JSON.stringify(likes)); } catch(e) {} }

const feed = document.getElementById("feed");
const dots = document.getElementById("dots");
let current = "producto";

function render(){
  const list = ITEMS.filter(i => i.tipo === current);
  feed.innerHTML = list.map((it, n) => `
    <article class="slide" aria-label="${esc(it.nombre)}">
      <div class="bg" style="background:radial-gradient(120% 80% at 50% 25%, ${it.colores[0]}, ${it.colores[1]} 75%)"></div>
      <div class="art">${it.foto ? `<img src="${esc(it.foto)}" alt="${esc(it.nombre)}" loading="lazy">` : ART[it.art]}</div>
      <div class="shade"></div>
      <div class="rail">
        <button class="act ${likes[it.nombre] ? "on" : ""}" data-like="${esc(it.nombre)}" aria-label="Me gusta">
          <span class="ic">${ICON.heart}</span>Me gusta</button>
        <button class="act" data-share="${n}" aria-label="Compartir"><span class="ic">${ICON.share}</span>Compartir</button>
        <a class="act" href="${waLink(it)}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
          <span class="ic" style="color:var(--wa)">${ICON.wa}</span>Escribir</a>
      </div>
      <div class="info">
        ${it.etiqueta ? `<span class="tag">${esc(it.etiqueta)}</span>` : ""}
        <h2>${esc(it.nombre)}</h2>
        <div class="price">${esc(it.precio)}${DEMO ? "<small>precio de ejemplo</small>" : ""}</div>
        <p class="desc">${esc(it.desc)}</p>
        <div class="chips">${it.chips.map(c => `<span>${esc(c)}</span>`).join("")}</div>
        <a class="wa" href="${waLink(it)}" target="_blank" rel="noopener">${ICON.wa} Escríbeme por WhatsApp</a>
        <div class="note">WhatsApp 305 257 7821 · Te respondemos y coordinamos la entrega</div>
      </div>
    </article>`).join("");
  dots.innerHTML = list.map((_, i) => `<i class="${i === 0 ? "cur" : ""}"></i>`).join("");
  feed.scrollTop = 0;
}

feed.addEventListener("scroll", () => {
  const i = Math.round(feed.scrollTop / feed.clientHeight);
  [...dots.children].forEach((d, k) => d.classList.toggle("cur", k === i));
  if (feed.scrollTop > 40) document.getElementById("hint").hidden = true;
}, {passive:true});

const toast = document.getElementById("toast");
function say(msg){ toast.textContent = msg; toast.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => toast.hidden = true, 1800); }

feed.addEventListener("click", e => {
  const like = e.target.closest("[data-like]");
  if (like) {
    const k = like.dataset.like; likes[k] = !likes[k]; saveLikes();
    like.classList.toggle("on", likes[k]);
    return;
  }
  const share = e.target.closest("[data-share]");
  if (share) {
    const link = location.href.split("#")[0];
    if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => say("Enlace copiado"), () => say("Copia el enlace desde la barra del navegador"));
    else say("Copia el enlace desde la barra del navegador");
  }
});

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  current = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));

render();
cargarHoja().then(() => { if (!DEMO) render(); });
</script>
