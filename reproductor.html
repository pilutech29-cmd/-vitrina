<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; background: #000; height: 100%; overflow: hidden; font-family: sans-serif; }
  video { width: 100%; height: 100%; background: #000; }
  #m { position: absolute; left: 0; right: 0; top: 44%; text-align: center; color: #ddd; font-size: 30px; }
  #b { position: absolute; left: 40px; bottom: 30px; color: #fff; font-size: 24px; background: rgba(0,0,0,.6);
       padding: 10px 22px; border-radius: 24px; display: none; }
</style>
</head>
<body>
<video id="v" autoplay playsinline disableRemotePlayback></video>
<div id="m">Cargando…</div>
<div id="b"></div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
  // La dirección del video llega después del #
  var url = decodeURIComponent(location.hash.slice(1));
  var v = document.getElementById('v'), m = document.getElementById('m'), b = document.getElementById('b');
  var t;
  function aviso(txt) { b.textContent = txt; b.style.display = 'block'; clearTimeout(t); t = setTimeout(function(){ b.style.display = 'none'; }, 2000); }
  function falla(txt) { m.textContent = txt; m.style.display = 'block'; }
  v.addEventListener('playing', function(){ m.style.display = 'none'; });
  v.addEventListener('waiting', function(){ m.textContent = 'Cargando…'; m.style.display = 'block'; });
  v.addEventListener('error', function(){ var e = v.error; falla('No se pudo reproducir (código ' + (e ? e.code : '?') + ' · ' + diag + ')'); });

  var diag = window.Hls ? ('hls.js ok, MSE ' + (Hls.isSupported() ? 'sí' : 'NO')) : 'sin hls.js';
  var esHls = /\.m3u8(\?|#|$)/i.test(url) || /\/hls\//i.test(url) || /m3u8/i.test(url);
  if (!url) {
    falla('No llegó la dirección del video');
  } else if (esHls && window.Hls && Hls.isSupported()) {
    var h = new Hls({ enableWorker: true, lowLatencyMode: false });
    h.loadSource(url);
    h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED, function(){ v.play(); });
    h.on(Hls.Events.ERROR, function(e, d){
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) { falla('El canal no responde (' + d.details + (d.response && d.response.code ? ' ' + d.response.code : '') + ')'); }
      else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { h.recoverMediaError(); }
      else { falla('No se pudo reproducir este canal (' + d.details + ')'); }
    });
  } else if (esHls && !window.Hls) {
    // Sin hls.js: intentar directo
    v.src = url; v.play().catch(function(){ falla('Falta el archivo hls.min.js en assets'); });
  } else {
    v.src = url; v.play().catch(function(){});
  }

  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') { v.currentTime += 10; aviso('+10 s'); }
    else if (e.key === 'ArrowLeft') { v.currentTime -= 10; aviso('-10 s'); }
    else if (e.key === 'Enter' || e.key === ' ' || e.key === 'MediaPlayPause') {
      if (v.paused) { v.play(); aviso('▶'); } else { v.pause(); aviso('❚❚ Pausa'); }
    }
  });
</script>
</body>
</html>
