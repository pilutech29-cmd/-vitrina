<style>
/* Pantalla de TV 16:9: producto a la izquierda, QR fijo a la derecha, cambia solo */
:root{--ink:#0d0c12;--paper:#f6f4fb;--muted:#b9b4c9;--wa:#25d366;
  --display:"Bricolage Grotesque","Arial Black",sans-serif;--body:"Figtree",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;cursor:none}
.stage{position:fixed;inset:0;display:grid;grid-template-columns:1fr 30vw;}
.slide{position:relative;overflow:hidden;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:3vw;padding:6vh 4vw}
.bg{position:absolute;inset:0;z-index:0;transition:background 1s ease}
.photo,.text{position:relative;z-index:1}
.photo{height:70vh;display:grid;place-items:center}
.photo img,.photo svg{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3vh 5vh rgba(0,0,0,.5))}
.tag{display:inline-block;font:700 1.6vh var(--body);letter-spacing:.1em;text-transform:uppercase;padding:.8vh 1.2vh;border-radius:.8vh;background:rgba(255,255,255,.15)}
h1{font-family:var(--display);font-weight:800;font-size:6.5vh;line-height:1.02;margin:2vh 0;letter-spacing:-.02em;text-wrap:balance}
.price{font-family:var(--display);font-weight:600;font-size:5vh}
.desc{color:var(--muted);font-size:2.6vh;line-height:1.45;margin:2vh 0}
.chips{display:flex;flex-wrap:wrap;gap:1vh}
.chips span{font-size:1.9vh;padding:.6vh 1.4vh;border:1px solid rgba(255,255,255,.25);border-radius:99px}
.fade{animation:in .8s ease both}
@keyframes in{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
aside{background:#15141c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh;padding:4vh 2vw;text-align:center;border-left:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:1.2vh;font-family:var(--display);font-weight:800;font-size:3.2vh}
.brand img{width:7vh;height:7vh;border-radius:50%}
.brand b{color:var(--wa)}
.qr{background:#fff;padding:2vh;border-radius:2vh}
.qr canvas,.qr img{width:30vh!important;height:30vh!important;display:block}
.scan{font-family:var(--display);font-weight:800;font-size:3.4vh;line-height:1.15}
.sub{color:var(--muted);font-size:2.1vh;line-height:1.4}
.wa{color:var(--wa);font-weight:700;font-size:2.6vh}
.bar{position:absolute;left:0;bottom:0;height:.6vh;background:var(--wa);z-index:2;width:0}
.bar.run{animation:grow linear forwards}
@keyframes grow{to{width:100%}}
.count{position:absolute;right:2vw;bottom:2.5vh;z-index:2;color:var(--muted);font-size:1.8vh;font-variant-numeric:tabular-nums}
</style>

const PALETA=["#3b2a8f","#0f6b5c","#a23b1f","#7a1f5c","#1f4fa2","#5b5f12"];
const BOX='<svg viewBox="0 0 300 220" width="520"><rect x="40" y="70" width="220" height="90" rx="26" fill="#1b1a22"/><rect x="40" y="70" width="220" height="44" rx="22" fill="#2a2933"/><circle cx="236" cy="118" r="4" fill="#25d366"/></svg>';
const esc=t=>String(t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmtPrecio(v){const n=v.replace(/[.\s]/g,"");return /^\d+$/.test(n)?"$"+Number(n).toLocaleString("es-CO"):v;}
function fotoURL(v){v=(v||"").trim();if(!v)return"";const m=v.match(/\/d\/([\w-]{20,})/)||v.match(/[?&]id=([\w-]{20,})/);return m?`https://drive.google.com/thumbnail?id=${m[1]}&sz=w1600`:v;}
function parseCSV(t){const R=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'){r.push(f);R.push(r);r=[];f=""}else if(c!='\r')f+=c}
  if(f!==""||r.length){r.push(f);R.push(r)}return R;}
async function cargar(){
  if(!SHEET_CSV)return;
  try{const res=await fetch(SHEET_CSV+(SHEET_CSV.includes("?")?"&":"?")+"t="+Date.now());if(!res.ok)return;
    const rows=parseCSV(await res.text());const h=rows.shift().map(x=>x.trim().toLowerCase());
    const it=rows.filter(r=>r.some(x=>x.trim())).map(r=>{const g=n=>h.indexOf(n)>=0?(r[h.indexOf(n)]||"").trim():"";
      return{nombre:g("nombre"),precio:fmtPrecio(g("precio")),etiqueta:g("etiqueta"),desc:g("descripcion")||g("descripción"),
        chips:g("pagos").split(",").map(x=>x.trim()).filter(Boolean),foto:fotoURL(g("foto")),activo:g("activo").toLowerCase()}})
      .filter(x=>x.nombre&&x.activo!=="no");
    if(it.length)ITEMS=it;}catch(e){}
}
let i=0,timer;
const slide=document.getElementById("slide");
function show(){
  const it=ITEMS[i%ITEMS.length],col=PALETA[i%PALETA.length];
  slide.innerHTML=`<div class="bg" style="background:radial-gradient(90% 90% at 30% 40%, ${col}, #0d0c12 75%)"></div>
   <div class="photo fade">${it.foto?`<img src="${esc(it.foto)}" alt="${esc(it.nombre)}">`:BOX}</div>
   <div class="text fade">${it.etiqueta?`<span class="tag">${esc(it.etiqueta)}</span>`:""}
     <h1>${esc(it.nombre)}</h1><div class="price">${esc(it.precio)}</div>
     <p class="desc">${esc(it.desc)}</p><div class="chips">${it.chips.map(c=>`<span>${esc(c)}</span>`).join("")}</div></div>
   <div class="bar run" style="animation-duration:${SEGUNDOS}s"></div>
   <div class="count">${(i%ITEMS.length)+1} / ${ITEMS.length}</div>`;
  clearTimeout(timer);timer=setTimeout(()=>{i++;show()},SEGUNDOS*1000);
}
// Flechas del control: izquierda/derecha cambian de producto
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"){i++;show()}
  else if(e.key==="ArrowLeft"){i=(i-1+ITEMS.length)%ITEMS.length;show()}
});
try{new QRCode(document.getElementById("qr"),{text:VITRINA_URL,width:480,height:480,correctLevel:QRCode.CorrectLevel.M});}
catch(e){const q=document.getElementById("qr");q.style.background="none";q.innerHTML='<div class="sub">'+VITRINA_URL.replace("https://","")+'</div>';}
show();
cargar().then(show);
// Recarga los productos cada 10 minutos por si cambiaste la hoja
setInterval(()=>cargar(),10*60*1000);
</script>
</body>
</html>
