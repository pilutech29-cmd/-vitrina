<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda PicksOnline TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Pantalla de TV 16:9: contenido navegable con el control a la izquierda, QR fijo a la derecha */
:root{--ink:#0d0c12;--card:#17161f;--line:#2a2833;--paper:#f6f4fb;--muted:#a9a4ba;--wa:#25d366;--wa-ink:#06280f;
  --display:"Bricolage Grotesque","Arial Black",sans-serif;--body:"Figtree",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;cursor:none}
.stage{position:fixed;inset:0;display:grid;grid-template-columns:1fr 27vw}
.main{display:flex;flex-direction:column;gap:3vh;padding:5vh 3.5vw 4vh;min-width:0;overflow:hidden}
.top{display:flex;align-items:center;gap:2vw}
.top h1{margin:0;font-family:var(--display);font-weight:800;font-size:5vh;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.top .sub{color:var(--muted);font-size:2.2vh;white-space:nowrap}
.search{display:flex;align-items:center;gap:1.2vh;width:34vw;max-width:520px;border:.3vh solid var(--line);background:var(--card);border-radius:1.6vh;padding:1.4vh 1.8vh}
.search svg{width:3vh;height:3vh;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--paper);font:500 2.4vh var(--body);outline:none}
.search input::placeholder{color:var(--muted)}
.btn{display:flex;align-items:center;gap:1vh;border:.3vh solid var(--line);background:var(--card);color:var(--paper);font:700 2.2vh var(--body);border-radius:1.4vh;padding:1.4vh 2vh;white-space:nowrap}
.btn svg{width:2.6vh;height:2.6vh}

.scroller{flex:1;min-height:0;overflow:hidden;position:relative}
.grid{display:grid;gap:2.2vh;padding:1vh}
.grid.cats{grid-template-columns:repeat(4,1fr)}
.grid.prods{grid-template-columns:repeat(4,1fr)}
.cat,.prod{border:.3vh solid var(--line);background:var(--card);border-radius:2.2vh;color:var(--paper);text-align:left;font:inherit;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.cat{display:flex;flex-direction:column;gap:2.4vh;padding:3vh 2.4vh;min-height:24vh;justify-content:space-between}
.cat .ico{width:8vh;height:8vh;border-radius:2vh;display:grid;place-items:center;background:var(--tint)}
.cat .ico svg{width:4.4vh;height:4.4vh}
.cat b{font-family:var(--display);font-weight:600;font-size:3vh;line-height:1.1}
.cat span{color:var(--muted);font-size:2vh;font-variant-numeric:tabular-nums}
.prod{display:flex;flex-direction:column;overflow:hidden;padding:0}
.prod .ph{height:20vh;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 20%,var(--tint),var(--card) 80%)}
.prod .ph img,.prod .ph svg{width:80%;height:80%;object-fit:contain}
.prod .tx{display:flex;flex-direction:column;gap:.6vh;padding:1.6vh 2vh 2.2vh;min-width:0}
.prod .tag{font:700 1.5vh var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--wa)}
.prod b{font-size:2.3vh;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod .pr{font-family:var(--display);font-weight:600;font-size:2.5vh;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:2.6vh;padding:4vh 1vh;line-height:1.5;max-width:60ch}

/* foco del control remoto */
.f:focus,.f.on{outline:none;border-color:var(--wa);box-shadow:0 0 0 .5vh rgba(37,211,102,.35);transform:scale(1.04)}
.search:focus-within{border-color:var(--wa);box-shadow:0 0 0 .5vh rgba(37,211,102,.35)}
@media (prefers-reduced-motion:reduce){.cat,.prod{transition:none}.f:focus{transform:none}}

.hint{display:flex;gap:3vw;color:var(--muted);font-size:1.9vh}
.hint kbd{font:700 1.7vh var(--body);border:.2vh solid var(--line);border-radius:.8vh;padding:.2vh .9vh;margin-right:.6vh;color:var(--paper)}

/* ficha */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:center;flex:1;min-height:0}
.detail .ph{height:56vh;border-radius:3vh;display:grid;place-items:center;background:radial-gradient(100% 90% at 50% 30%,var(--tint),var(--ink) 80%)}
.detail .ph img,.detail .ph svg{width:80%;height:80%;object-fit:contain}
.detail .tag{display:inline-block;font:700 1.6vh var(--body);letter-spacing:.1em;text-transform:uppercase;padding:.8vh 1.2vh;border-radius:.8vh;background:rgba(255,255,255,.12)}
.detail h2{font-family:var(--display);font-weight:800;font-size:6vh;line-height:1.02;margin:2vh 0;letter-spacing:-.02em;text-wrap:balance}
.detail .pr{font-family:var(--display);font-weight:600;font-size:4.4vh}
.detail p{color:var(--muted);font-size:2.5vh;line-height:1.45;margin:2vh 0;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:1vh}
.chips span{font-size:1.9vh;padding:.6vh 1.4vh;border:.2vh solid var(--line);border-radius:99px}

.acts{display:flex;gap:1.6vw;margin-top:3.4vh;flex-wrap:wrap}
.btn.buy{background:var(--wa);border-color:var(--wa);color:var(--wa-ink);font-size:2.6vh;padding:1.8vh 3vh}
.btn.buy.f:focus{box-shadow:0 0 0 .6vh rgba(255,255,255,.75);border-color:#fff}
.form{display:flex;flex-direction:column;gap:2vh;max-width:60vw;padding:1vh}
.form h2{margin:0;font-family:var(--display);font-weight:800;font-size:4.6vh;line-height:1.05;text-wrap:balance}
.form p{margin:0;color:var(--muted);font-size:2.5vh;line-height:1.45;max-width:46ch}
.field{display:flex;flex-direction:column;gap:1vh;margin-top:1vh}
.field span{font:700 1.9vh var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{width:30vw;font:700 4vh var(--display);letter-spacing:.04em;color:var(--paper);background:var(--card);border:.3vh solid var(--line);border-radius:1.6vh;padding:1.6vh 2.2vh;font-variant-numeric:tabular-nums}
.err{color:#ff8a8a;font-size:2.2vh;max-width:50ch}
.qrbig{align-self:flex-start}
.ok .okico{width:11vh;height:11vh;border-radius:50%;display:grid;place-items:center;background:var(--wa);color:var(--wa-ink)}
.ok .okico svg{width:6vh;height:6vh}
aside{background:#15141c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;padding:4vh 2vw;text-align:center;border-left:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:1.4vh}
.brand img{width:7.5vh;height:7.5vh;border-radius:50%}
.brand .bn{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.brand b{font-family:var(--display);font-weight:800;font-size:4vh}
.brand small{font:600 1.8vh var(--body);color:var(--muted);margin-top:.5vh}
.brand small i{font-style:normal;color:var(--wa)}
.qr{background:#fff;padding:2vh;border-radius:2vh}
.qr canvas,.qr img{width:28vh!important;height:28vh!important;display:block}
.scan{font-family:var(--display);font-weight:800;font-size:3.2vh;line-height:1.15}
.qsub{color:var(--muted);font-size:2vh;line-height:1.4}
.wa{color:var(--wa);font-weight:700;font-size:2.6vh}
</style>
</head>

  }
}

// ---- vistas ----
const view = document.getElementById("view"), scroller = document.getElementById("scroller");
const title = document.getElementById("title"), sub = document.getElementById("sub"), q = document.getElementById("q");
let estado = {vista:"cats", cat:null, item:null, volverA:null};

function tarjeta(it){
  const i = ITEMS.indexOf(it);
  return `<button class="prod f" data-i="${i}" style="--tint:${tintDe(it.categoria)}">
    <div class="ph">${it.foto?`<img src="${esc(it.foto)}" alt="">`:BOX}</div>
    <div class="tx">${it.etiqueta?`<span class="tag">${esc(it.etiqueta)}</span>`:""}<b>${esc(it.nombre)}</b><span class="pr">${esc(it.precio)}</span></div></button>`;
}
function botonVolver(){ return `<button class="btn f" data-back="1">${BACK} Volver</button>`; }

function render(foco){
  scroller.scrollTop = 0;
  const term = norm(q.value);
  if (estado.vista === "item"){
    const it = estado.item;
    title.textContent = it.categoria; sub.textContent = "";
    view.innerHTML = `<div class="detail" style="--tint:${tintDe(it.categoria)}">
      <div class="ph">${it.foto?`<img src="${esc(it.foto)}" alt="${esc(it.nombre)}">`:BOX}</div>
      <div>${it.etiqueta?`<span class="tag">${esc(it.etiqueta)}</span>`:""}
        <h2>${esc(it.nombre)}</h2><div class="pr">${esc(it.precio)}</div>
        ${it.desc?`<p>${esc(it.desc)}</p>`:""}
        ${it.pagos.length?`<div class="chips">${it.pagos.map(p=>`<span>${esc(p)}</span>`).join("")}</div>`:""}
        <div class="acts"><button class="btn buy f" data-buy="1">${CART} ${esServicio(it)?"Solicitar servicio":"Lo quiero"}</button>${botonVolver()}</div></div></div>`;
    qrGeneral();
  } else if (estado.vista === "pedido"){
    const it = estado.item;
    title.textContent = esServicio(it) ? "Solicitar servicio" : "Hacer pedido"; sub.textContent = "";
    if (!PEDIDOS_ACTIVOS){
      view.innerHTML = `<div class="form"><h2>${esc(it.nombre)} · ${esc(it.precio)}</h2>
        <p>Escanea este código con la cámara de tu celular. Se abre WhatsApp con tu pedido y la foto del producto: solo toca <b>Enviar</b>.</p>
        <div class="qr qrbig" id="qrPedido"></div><div class="acts">${botonVolver()}</div></div>`;
      try{ new QRCode(document.getElementById("qrPedido"),{text:waLink(it),width:420,height:420,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
    } else {
      view.innerHTML = `<div class="form"><h2>${esc(it.nombre)} · ${esc(it.precio)}</h2>
        <p>Escribe tu número de WhatsApp y PicksOnline te contacta en minutos para confirmar tu pedido.</p>
        <label class="field"><span>Tu número de WhatsApp</span>
          <input id="tel" class="f" type="tel" inputmode="numeric" maxlength="10" placeholder="300 123 4567" autocomplete="off"></label>
        <div class="err" id="err" hidden></div>
        <div class="acts"><button class="btn buy f" data-send="1">${WA_ICON} Enviar pedido</button>${botonVolver()}</div></div>`;
    }
    qrGeneral();
  } else if (estado.vista === "listo"){
    title.textContent = "¡Pedido enviado!"; sub.textContent = "";
    view.innerHTML = `<div class="form ok"><div class="okico">${CHECK}</div>
      <h2>Recibimos tu pedido de ${esc(estado.item.nombre)}</h2>
      <p>Te vamos a escribir al WhatsApp <b>${esc(estado.tel.replace(/(\d{3})(\d{3})(\d{4})/,"$1 $2 $3"))}</b> para confirmar el pago y la entrega.</p>
      <div class="acts"><button class="btn f" data-home="1">Seguir mirando</button></div></div>`;
    qrGeneral();
  } else if (estado.vista === "search" && term){
    const res = ITEMS.filter(it => norm(`${it.nombre} ${it.categoria} ${it.desc} ${it.etiqueta}`).includes(term));
    title.textContent = "Resultados"; sub.textContent = `${res.length} para "${q.value}"`;
    view.innerHTML = res.length ? `<div class="grid prods">${res.map(tarjeta).join("")}</div>`
      : `<div class="empty">No encontramos "${esc(q.value)}". Escanea el código y pregúntanos por WhatsApp: te ayudamos a conseguirlo.</div><div class="grid" style="grid-template-columns:auto 1fr">${botonVolver()}</div>`;
    qrGeneral();
  } else if (estado.vista === "cat"){
    const lista = ITEMS.filter(it => it.categoria === estado.cat);
    title.textContent = estado.cat; sub.textContent = `${lista.length} ${lista.length===1?"opción":"opciones"}`;
    view.innerHTML = `<div class="grid prods">${lista.map(tarjeta).join("")}</div>`;
    qrGeneral();
  } else {
    estado.vista = "cats";
    title.textContent = "¿Qué estás buscando?"; sub.textContent = "";
    view.innerHTML = `<div class="grid cats">${categorias().map(c=>`<button class="cat f" data-cat="${esc(c.nombre)}" style="--tint:${c.tint}">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${CAT_ICON[norm(c.nombre)]||ICON_DEF}</svg></span>
      <div><b>${esc(c.nombre)}</b><br><span>${c.n} ${c.n===1?"opción":"opciones"}</span></div></button>`).join("")}</div>`;
    qrGeneral();
  }
  enfocar(foco);
}
function enfocar(sel){
  const el = (sel && view.querySelector(sel)) || view.querySelector(".f") || q;
  el.focus({preventScroll:true}); asegurarVisible(el);
}
function asegurarVisible(el){
  if (!scroller.contains(el)) return;
  const r = el.getBoundingClientRect(), s = scroller.getBoundingClientRect();
  if (r.bottom > s.bottom) scroller.scrollTop += r.bottom - s.bottom + 12;
  else if (r.top < s.top) scroller.scrollTop -= s.top - r.top + 12;
}

let enviando = false;
async function mandar(){
  if (enviando) return;
  const inp = document.getElementById("tel"), err = document.getElementById("err");
  const tel = (inp.value || "").replace(/\D/g,"");
  if (!/^3\d{9}$/.test(tel)){ err.textContent = "Escribe un celular de 10 dígitos que empiece por 3, por ejemplo 300 123 4567."; err.hidden = false; inp.focus(); return; }
  enviando = true; err.hidden = true;
  const btn = view.querySelector("[data-send]"); btn.textContent = "Enviando…";
  try { await enviarPedido(estado.item, tel); estado = {vista:"listo", item:estado.item, tel}; render('[data-home]'); }
  catch(e){ err.textContent = "No se pudo enviar. Revisa que el equipo tenga internet e inténtalo de nuevo."; err.hidden = false; btn.innerHTML = WA_ICON + " Enviar pedido"; }
  enviando = false;
}
function abrir(el){
  if (el.dataset.cat){ estado = {vista:"cat", cat:el.dataset.cat}; render(); }
  else if (el.dataset.i){ estado = {vista:"item", item:ITEMS[+el.dataset.i], volverA:{...estado}, foco:`[data-i="${el.dataset.i}"]`}; render('[data-buy]'); }
  else if (el.dataset.buy){ estado = {vista:"pedido", item:estado.item, desde:estado}; render(PEDIDOS_ACTIVOS ? "#tel" : "[data-back]"); }
  else if (el.dataset.send) mandar();
  else if (el.dataset.home){ estado = {vista:"cats"}; render(); }
  else if (el.dataset.back) volver();
}
function volver(){
  if (estado.vista === "pedido" && estado.desde){ estado = estado.desde; render('[data-buy]'); return true; }
  if (estado.vista === "listo"){ estado = {vista:"cats"}; render(); return true; }
  if (estado.vista === "item" && estado.volverA){ const f = estado.foco; estado = estado.volverA; render(f); return true; }
  if (estado.vista === "cat"){ const c = estado.cat; estado = {vista:"cats"}; render(`[data-cat="${CSS.escape(c)}"]`); return true; }
  if (estado.vista === "search"){ q.value = ""; estado = {vista:"cats"}; render(); return true; }
  return false;
}

// ---- navegación con el control (flechas) ----
function candidatos(){ return [q, ...view.querySelectorAll(".f")]; }
function mover(dir){
  const act = document.activeElement && candidatos().includes(document.activeElement) ? document.activeElement : null;
  if (!act){ enfocar(); return; }
  const a = act.getBoundingClientRect(), ax = a.left + a.width/2, ay = a.top + a.height/2;
  let mejor = null, mejorD = Infinity;
  for (const el of candidatos()){
    if (el === act) continue;
    const b = el.getBoundingClientRect(), bx = b.left + b.width/2, by = b.top + b.height/2;
    const dx = bx - ax, dy = by - ay;
    const ok = dir==="ArrowRight" ? dx > 4 : dir==="ArrowLeft" ? dx < -4 : dir==="ArrowDown" ? dy > 4 : dy < -4;
    if (!ok) continue;
    const prin = (dir==="ArrowRight"||dir==="ArrowLeft") ? Math.abs(dx) : Math.abs(dy);
    const lat = (dir==="ArrowRight"||dir==="ArrowLeft") ? Math.abs(dy) : Math.abs(dx);
    const d = prin + lat * 2.5;
    if (d < mejorD){ mejorD = d; mejor = el; }
  }
  if (mejor){ mejor.focus({preventScroll:true}); asegurarVisible(mejor); }
}

document.addEventListener("keydown", e => {
  const enBuscador = document.activeElement === q;
  const enTel = document.activeElement && document.activeElement.id === "tel";
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){
    if ((enBuscador || enTel) && (e.key==="ArrowLeft"||e.key==="ArrowRight") && document.activeElement.value) return; // mover cursor del texto
    e.preventDefault(); mover(e.key); return;
  }
  if (e.key === "Enter"){
    if (enTel){ e.preventDefault(); mandar(); return; }
    if (enBuscador){ e.preventDefault(); if (q.value.trim()){ estado = {vista:"search"}; render(); } return; }
    const el = document.activeElement;
    if (el && el.classList.contains("f")){ e.preventDefault(); abrir(el); }
    return;
  }
  if (["Escape","Backspace","GoBack","BrowserBack"].includes(e.key) || e.keyCode === 4){
    if ((enBuscador || enTel) && e.key === "Backspace" && document.activeElement.value) return;
    if (volver()) e.preventDefault();
  }
});
view.addEventListener("click", e => { const el = e.target.closest(".f"); if (el) abrir(el); });
q.addEventListener("input", () => { if (q.value.trim()){ estado = {vista:"search"}; const f = document.activeElement; render(); f.focus(); } else if (estado.vista==="search"){ estado = {vista:"cats"}; render(); q.focus(); } });

// ---- productos desde Google Sheets ----
function parseCSV(t){const R=[];let r=[],f="",qq=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(qq){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else qq=false}else f+=c}
  else if(c=='"')qq=true;else if(c==','){r.push(f);f=""}else if(c=='\n'){r.push(f);R.push(r);r=[];f=""}else if(c!='\r')f+=c}
  if(f!==""||r.length){r.push(f);R.push(r)}return R;}
async function cargar(){
  if (!SHEET_CSV) return false;
  try{
    const res = await fetch(SHEET_CSV+(SHEET_CSV.includes("?")?"&":"?")+"t="+Date.now()); if(!res.ok) return false;
    const rows = parseCSV(await res.text()); const h = rows.shift().map(x=>norm(x));
    const it = rows.filter(r=>r.some(x=>x.trim())).map(r=>{const g=n=>h.indexOf(n)>=0?(r[h.indexOf(n)]||"").trim():"";
      return {categoria:g("categoria")||(norm(g("tipo")).startsWith("serv")?"Servicio técnico":"Productos"),
        nombre:g("nombre"),precio:fmtPrecio(g("precio")),etiqueta:g("etiqueta"),desc:g("descripcion"),
        pagos:g("pagos").split(",").map(x=>x.trim()).filter(Boolean),foto:fotoURL(g("foto")),activo:norm(g("activo"))};})
      .filter(x=>x.nombre&&x.activo!=="no");
    if (it.length){ ITEMS = it; return true; }
  }catch(e){}
  return false;
}

render();
cargar().then(ok => { if (ok && estado.vista === "cats") render(); });
// Recarga los productos cada 10 minutos por si cambiaste la hoja
setInterval(() => cargar().then(ok => { if (ok && estado.vista === "cats") render(); }), 10*60*1000);
</script>
